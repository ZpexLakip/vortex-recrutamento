services:
  app:
    build: .
    ports:
      - "127.0.0.1:8001:8000"

    environment:
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: vortex_recrutamento
      DB_USERNAME: vortex
      DB_PASSWORD: vortex_dev

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          php artisan key:generate || exit 1
        fi
        php artisan migrate --force &&
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: vortex_recrutamento
      MYSQL_USER: vortex
      MYSQL_PASSWORD: vortex_dev
      MYSQL_ROOT_PASSWORD: root_dev

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u vortex -pvortex_dev -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
